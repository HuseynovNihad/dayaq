name: dayaq
description: "Dayaq charity and donation mobile application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.9.2
  get_it: ^9.2.1
  go_router: ^17.0.0
  equatable: ^2.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  dropdown_button2: ^3.1.0
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  pdf: ^3.13.1
  path_provider: ^2.1.6
  image: ^4.12.0
  url_launcher: ^6.3.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
        - asset: assets/fonts/NunitoSans-Italic.ttf
          style: italic